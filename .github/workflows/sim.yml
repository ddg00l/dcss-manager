name: Balance simulation

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Game days per session'
        default: '7'
      sessions:
        description: 'Sessions per tactic per shard (heavy tactics split 4 ways at half this)'
        default: '6'

permissions:
  contents: read

jobs:
  # The shard layout is computed rather than hardcoded: a GitHub job dies at 6
  # hours, and the productive tactics are the expensive ones (measured on a
  # 90-day sweep: shardwhale 230 min against afk's 53). Heavy tactics split four
  # ways at half the sessions each -- same total sample, half the wall time --
  # so a long run cannot lose a whole shard to the ceiling.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          echo "matrix=$(python3 tools/sim/shard_plan.py '${{ github.event.inputs.sessions }}')" >> "$GITHUB_OUTPUT"
      - name: Show the plan
        run: python3 tools/sim/shard_plan.py '${{ github.event.inputs.sessions }}' | python3 -m json.tool | head -40

  simulate:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Run ${{ matrix.job.tactic }} shard ${{ matrix.job.shard }}
        env:
          SEED_BASE: ${{ matrix.job.seedBase }}
        run: |
          bun tools/sim/worker.mjs "${{ matrix.job.tactic }}" "${{ matrix.job.sessions }}" "${{ github.event.inputs.days }}" \
            > "${{ matrix.job.tactic }}_${{ matrix.job.shard }}.ndjson"
      - uses: actions/upload-artifact@v4
        with:
          name: sim-${{ matrix.job.tactic }}-${{ matrix.job.shard }}
          path: '*.ndjson'

  aggregate:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true
      - name: Aggregate
        run: |
          python3 tools/sim/aggregate.py 'results/*.ndjson' | tee summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sim-summary
          path: |
            summary.txt
            results/*.ndjson
